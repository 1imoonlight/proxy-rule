name: sync-ip-rules

on:
  schedule:
    # 上游 DustinWin/geoip 每天约 23:55 UTC 发布，错开一个多小时再拉
    - cron: "17 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-ip-rules

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: 生成带 no-resolve 的 IP 规则集
        run: bash .github/scripts/sync-ip-rules.sh

      - name: 有变化则提交
        run: |
          git add rule/noresolve
          if git diff --cached --quiet; then
            echo "无变化"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: sync DustinWin IP rule sets with no-resolve"
          git push
